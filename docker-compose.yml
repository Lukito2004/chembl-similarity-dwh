x-airflow-depends-on: &airflow-depends-on
  postgres-airflow:
    condition: service_healthy
  postgres-dwh:
    condition: service_healthy

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    CHEMBL_API_BASE_URL: ${CHEMBL_API_BASE_URL}
    CHEMBL_API_PAGE_SIZE: ${CHEMBL_API_PAGE_SIZE}
    CHEMBL_API_TIMEOUT_SECONDS: ${CHEMBL_API_TIMEOUT_SECONDS}
    CHEMBL_API_MAX_RETRIES: ${CHEMBL_API_MAX_RETRIES}
    CHEMBL_API_REQUESTS_PER_SECOND: ${CHEMBL_API_REQUESTS_PER_SECOND}
    CHEMBL_API_MAX_WORKERS: ${CHEMBL_API_MAX_WORKERS}
    CHEMBL_DUMP_BASE_URL: ${CHEMBL_DUMP_BASE_URL}
    CHEMBL_DUMP_DIR: ${CHEMBL_DUMP_DIR}
    CHEMBL_DUMP_CHUNK_SIZE: ${CHEMBL_DUMP_CHUNK_SIZE}
    CHEMBL_DUMP_TIMEOUT_SECONDS: ${CHEMBL_DUMP_TIMEOUT_SECONDS}
    PYTHONPATH: /opt/airflow/src
    AWS_PROFILE: ${AWS_PROFILE}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    CHEMBL_S3_BUCKET: ${CHEMBL_S3_BUCKET}
    CHEMBL_S3_ROOT_PREFIX: ${CHEMBL_S3_ROOT_PREFIX}
    CHEMBL_FP_RADIUS: ${CHEMBL_FP_RADIUS}
    CHEMBL_FP_N_BITS: ${CHEMBL_FP_N_BITS}
    CHEMBL_FP_SHARD_SIZE: ${CHEMBL_FP_SHARD_SIZE}
    # The warehouse is reached two ways: our library uses the DSN, Airflow operators
    # use the connection. Both are assembled from the same five .env values.
    CHEMBL_DWH_DSN: postgresql://${CHEMBL_DWH_USER}:${CHEMBL_DWH_PASSWORD}@${CHEMBL_DWH_HOST}:${CHEMBL_DWH_PORT}/${CHEMBL_DWH_NAME}
    AIRFLOW_CONN_CHEMBL_DWH: postgres://${CHEMBL_DWH_USER}:${CHEMBL_DWH_PASSWORD}@${CHEMBL_DWH_HOST}:${CHEMBL_DWH_PORT}/${CHEMBL_DWH_NAME}
    CHEMBL_LOG_LEVEL: ${CHEMBL_LOG_LEVEL}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./sql:/opt/airflow/sql:ro
    - ./data:/opt/airflow/data
    - ${HOME}/.aws:/home/airflow/.aws
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-dwh:
    # Matches the pg_restore shipped in the Airflow image. A 17 client emits
    # SET transaction_timeout, which a 16 server rejects during restore.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${CHEMBL_DWH_USER}
      POSTGRES_PASSWORD: ${CHEMBL_DWH_PASSWORD}
      POSTGRES_DB: ${CHEMBL_DWH_NAME}
    # Tuned for bulk loading a few million rows. The warehouse is reproducible from
    # the API, so trading crash durability for load speed is an acceptable exchange.
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_wal_size=2GB
      -c checkpoint_timeout=15min
      -c synchronous_commit=off
    shm_size: 256mb
    ports:
      - "${CHEMBL_DWH_HOST_PORT}:5432"
    volumes:
      - chembl-dwh-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHEMBL_DWH_USER} -d ${CHEMBL_DWH_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Migrates the metadata database and creates the admin user, both idempotently.
  # The image entrypoint handles this, so it must not be overridden here.
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      _AIRFLOW_WWW_USER_FIRSTNAME: Luka
      _AIRFLOW_WWW_USER_LASTNAME: Javakhishvili
    command: version
    depends_on: *airflow-depends-on
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db:
  chembl-dwh-db:
